<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c08a3e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <text x="30" y="36" font-size="17" font-weight="600" fill="#1f2933">Long-Tail Mining by Sparse Feature Decomposition</text>
  <text x="30" y="56" font-size="12" fill="#64748b">A frozen vision-language model is used as a feature extractor; the sparse autoencoder does the deciding.</text>

  <!-- Row 1 -->
  <rect x="30" y="92" width="210" height="96" rx="6" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="44" y="116" font-size="13" font-weight="600" fill="#1f2933">1  Six-view frame</text>
  <text x="44" y="138" font-size="11" fill="#64748b">CAM_FRONT, FRONT_LEFT,</text>
  <text x="44" y="154" font-size="11" fill="#64748b">FRONT_RIGHT, BACK,</text>
  <text x="44" y="170" font-size="11" fill="#64748b">BACK_LEFT, BACK_RIGHT</text>

  <line x1="240" y1="140" x2="268" y2="140" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="272" y="92" width="240" height="96" rx="6" fill="#e8f0ea" stroke="#6b9080"/>
  <text x="286" y="116" font-size="13" font-weight="600" fill="#1f2933">2  Frozen VLM</text>
  <text x="286" y="138" font-size="11" fill="#64748b">scene-description prompt,</text>
  <text x="286" y="154" font-size="11" fill="#64748b">not a classification prompt</text>
  <text x="286" y="174" font-size="11" fill="#1f2933">hidden state h, layer 28, mean-pooled</text>

  <line x1="512" y1="140" x2="540" y2="140" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="544" y="92" width="270" height="96" rx="6" fill="#f3e9f7" stroke="#a47bb9"/>
  <text x="558" y="116" font-size="13" font-weight="600" fill="#1f2933">3  Tail-guided sparse autoencoder</text>
  <text x="558" y="140" font-size="11" fill="#64748b">z = AbsTopK(f_enc(h)),  k = 512 of P units</text>
  <text x="558" y="160" font-size="12" fill="#1f2933">z = [ z_n  |  z_t ]</text>
  <text x="558" y="178" font-size="11" fill="#64748b">normal subspace  |  long-tail subspace</text>

  <!-- Weak-label branch -->
  <rect x="30" y="232" width="210" height="76" rx="6" fill="#fdf1e0" stroke="#d0a060"/>
  <text x="44" y="256" font-size="13" font-weight="600" fill="#1f2933">Normal-core rubric</text>
  <text x="44" y="277" font-size="11" fill="#64748b">would the ego vehicle need</text>
  <text x="44" y="293" font-size="11" fill="#64748b">an extra defensive action?</text>

  <line x1="240" y1="270" x2="268" y2="270" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="272" y="232" width="240" height="76" rx="6" fill="#fdf1e0" stroke="#d0a060"/>
  <text x="286" y="256" font-size="13" font-weight="600" fill="#1f2933">VLM labeller</text>
  <text x="286" y="277" font-size="11" fill="#64748b">answer-token logits, not parsed text</text>
  <text x="286" y="295" font-size="11" fill="#1f2933">weak label y in {0, 1}</text>

  <path d="M512 262 H660 V192" fill="none" stroke="#c08a3e" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="530" y="254" font-size="11" fill="#c08a3e">training only</text>

  <!-- Elbow into row 2 -->
  <path d="M679 188 V350 H136 V378" fill="none" stroke="#64748b" marker-end="url(#a)"/>

  <!-- Row 2 -->
  <rect x="30" y="382" width="210" height="96" rx="6" fill="#eaf0fb" stroke="#7d94c4"/>
  <text x="44" y="406" font-size="13" font-weight="600" fill="#1f2933">4  Tail score</text>
  <text x="44" y="430" font-size="12" fill="#1f2933">s(x) = || z_t ||</text>
  <text x="44" y="452" font-size="11" fill="#64748b">how strongly the long-tail</text>
  <text x="44" y="468" font-size="11" fill="#64748b">subspace responds</text>

  <line x1="240" y1="430" x2="268" y2="430" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="272" y="382" width="240" height="96" rx="6" fill="#eaf0fb" stroke="#7d94c4"/>
  <text x="286" y="406" font-size="13" font-weight="600" fill="#1f2933">5  Decision</text>
  <text x="286" y="430" font-size="12" fill="#1f2933">long-tail  if  s(x) &gt;= eta</text>
  <text x="286" y="452" font-size="11" fill="#64748b">eta chosen on validation,</text>
  <text x="286" y="468" font-size="11" fill="#64748b">applied unchanged to test</text>

  <line x1="512" y1="430" x2="540" y2="430" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="544" y="382" width="270" height="96" rx="6" fill="#e9f6ee" stroke="#5d9c76"/>
  <text x="558" y="406" font-size="13" font-weight="600" fill="#1f2933">6  Output</text>
  <text x="558" y="428" font-size="11" fill="#64748b">ranked long-tail candidates</text>
  <text x="558" y="446" font-size="11" fill="#64748b">activated units + their names = the reason</text>
  <text x="558" y="464" font-size="11" fill="#64748b">precision / recall / F1 against the baselines</text>
</svg>
