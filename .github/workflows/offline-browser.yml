name: Offline explorer browser smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/offline-browser.yml
      - scripts/verify_offline_browser.py
      - scripts/export_offline_explorer.py
      - scripts/neuron_explorer.py
      - tools/review_upload.html
      - demo/driving_pilot.html
  pull_request:
    paths:
      - .github/workflows/offline-browser.yml
      - scripts/verify_offline_browser.py
      - scripts/export_offline_explorer.py
      - scripts/neuron_explorer.py
      - tools/review_upload.html
      - demo/driving_pilot.html
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0 playwright==1.62.0 flake8==7.4.1
      - run: python -m flake8 scripts/verify_offline_browser.py --max-line-length 100
      - name: Locate or install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python scripts/verify_offline_browser.py --source-html demo/driving_pilot.html --output output/browser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driving-offline-browser
          path: |
            output/browser-smoke/verification.json
            output/browser-smoke/desktop.png
            output/browser-smoke/mobile.png
          if-no-files-found: warn
          retention-days: 7
