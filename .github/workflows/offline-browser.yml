name: Offline explorer browser smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/offline-browser.yml
      - scripts/verify_offline_browser.py
      - scripts/export_offline_explorer.py
      - scripts/neuron_explorer.py
      - tools/review_upload.html
      - demo/driving_pilot.html
      - demo/driving_ai_pilot.html
  pull_request:
    paths:
      - .github/workflows/offline-browser.yml
      - scripts/verify_offline_browser.py
      - scripts/export_offline_explorer.py
      - scripts/neuron_explorer.py
      - tools/review_upload.html
      - demo/driving_pilot.html
      - demo/driving_ai_pilot.html
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        demo: [driving_pilot, driving_ai_pilot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0 playwright==1.62.0 flake8==7.4.1
      - run: python -m flake8 scripts/verify_offline_browser.py --max-line-length 100
      - name: Locate or install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Exercise cached demo with synthetic local images
        run: >-
          python scripts/verify_offline_browser.py
          --source-html demo/${{ matrix.demo }}.html
          --output output/browser-smoke/${{ matrix.demo }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driving-offline-browser-${{ matrix.demo }}
          path: |
            output/browser-smoke/${{ matrix.demo }}/verification.json
            output/browser-smoke/${{ matrix.demo }}/desktop.png
            output/browser-smoke/${{ matrix.demo }}/mobile.png
            output/browser-smoke/${{ matrix.demo }}/core.stdout.txt
            output/browser-smoke/${{ matrix.demo }}/core.stderr.txt
            output/browser-smoke/${{ matrix.demo }}/failure.txt
          if-no-files-found: warn
          retention-days: 7
