name: CPU contracts and synthetic demo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu-lock.txt
      - run: python -m pip install -r requirements-cpu-lock.txt
      - run: make test lint
      - run: make e2e
